<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>ניהול מורשים | קיט מתכונים</title>
<link rel="icon" href="assets/icons/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/icons/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png">
<link rel="icon" href="assets/icons/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/icons/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
<style>
  .admin-wrap{max-width:760px;margin:0 auto;padding:50px 24px 90px;}
  .admin-title{color:var(--terracotta);font-size:1.8rem;margin-bottom:6px;}
  .admin-sub{color:var(--ink-soft);font-size:.92rem;margin-bottom:28px;}
  .admin-lock{
    background:#fff;border-radius:20px;padding:34px;box-shadow:var(--shadow);
    max-width:420px;margin:60px auto;text-align:center;
  }
  .admin-lock input{
    width:100%;padding:12px 16px;border-radius:12px;border:1.5px solid rgba(180,113,75,.25);
    font-family:'Heebo';font-size:.95rem;margin:16px 0;outline:none;
  }
  .admin-lock input:focus{border-color:var(--terracotta);}
  table.admin-table{width:100%;border-collapse:collapse;background:#fff;border-radius:16px;overflow:hidden;box-shadow:var(--shadow);}
  table.admin-table th{background:var(--band-mid);color:var(--terracotta-deep);font-family:'Rubik';font-weight:700;font-size:.82rem;padding:12px 14px;text-align:right;}
  table.admin-table td{padding:12px 14px;border-top:1px solid rgba(180,113,75,.1);font-size:.9rem;vertical-align:middle;}
  table.admin-table tr:hover td{background:rgba(180,113,75,.04);}
  .status-pill{font-family:'Rubik';font-weight:700;font-size:.75rem;padding:4px 12px;border-radius:999px;display:inline-block;}
  .status-pill.approved{background:rgba(126,154,114,.18);color:var(--sage-line);}
  .status-pill.pending{background:rgba(180,113,75,.14);color:var(--terracotta-deep);}
  .row-btn{
    font-family:'Rubik';font-weight:700;font-size:.8rem;padding:7px 16px;border-radius:999px;
    border:none;cursor:pointer;
  }
  .row-btn.approve{background:var(--sage);color:#fff;}
  .row-btn.revoke{background:#fff;color:#b1503b;border:1.5px solid #b1503b;}
  .admin-empty{text-align:center;color:var(--ink-soft);padding:40px;}
  .admin-refresh{margin-bottom:16px;}
.settings-card{background:#fff;border-radius:16px;padding:18px 20px;box-shadow:var(--shadow);margin-bottom:18px;}
.settings-title{font-family:'Rubik';font-weight:700;color:var(--terracotta-deep);font-size:.92rem;margin-bottom:10px;}
.settings-row{display:flex;align-items:center;gap:8px;font-size:.9rem;margin-bottom:6px;cursor:pointer;}
.settings-row input{width:17px;height:17px;cursor:pointer;}
.settings-status{font-size:.8rem;color:var(--sage-line);min-height:16px;margin-top:4px;}
  .admin-loading{text-align:center;color:var(--ink-soft);padding:40px;}
.back-link{display:inline-flex;align-items:center;gap:6px;color:var(--terracotta);text-decoration:none;font-family:'Rubik';font-weight:700;font-size:.9rem;}
.back-link:hover{text-decoration:underline;}
.admin-topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px;}
.topbar-logo{width:38px;height:38px;border-radius:50%;overflow:hidden;border:2px solid #F5D98C;flex-shrink:0;}
.topbar-logo img{width:100%;height:100%;object-fit:cover;display:block;}
</style>
</head>
<body>

<div class="admin-wrap">
<div class="admin-topbar">
<img class="topbar-logo" src="assets/icons/gate-logo.png" alt="100 המתכונים הראשונים שלי">
<a href="index.html" class="back-link">→ חזרה למתכונים</a>
<img class="topbar-logo" src="assets/icons/gate-logo.png" alt="100 המתכונים הראשונים שלי">
</div>
  <div id="lockScreen" class="admin-lock">
    <div class="gate-icon" style="margin:0 auto 14px;">🔒</div>
    <h2 style="color:var(--terracotta);margin-bottom:10px;">ניהול מורשים</h2>
    <p style="color:var(--ink-soft);font-size:.9rem;margin-bottom:6px;">רק בעל האתר יכול להיכנס לעמוד הזה.</p>
    <p style="color:var(--ink-soft);font-size:.85rem;margin-bottom:16px;">התחבר עם חשבון ה-Google שלך כדי להמשיך.</p>
    <div id="adminGoogleBtn" style="display:flex;justify-content:center;margin:10px 0;"></div>
    <div id="lockError" style="color:#b1503b;font-size:.85rem;margin-top:12px;"></div>
  </div>

  <div id="adminPanel" style="display:none;">
    <h1 class="admin-title">ניהול מורשים</h1>
    <p class="admin-sub">כל מי שביקש גישה לאתר המתכונים. אשרי או בטלי גישה בלחיצת כפתור.</p>
    <div class="settings-card" id="settingsCard">
      <div class="settings-title">קבלת התראה על בקשת גישה חדשה</div>
      <label class="settings-row">
        <input type="checkbox" id="notifyEmailCheckbox">
        <span>📧 מייל</span>
      </label>
      <label class="settings-row">
        <input type="checkbox" id="notifyTelegramCheckbox">
        <span>💬 טלגרם</span>
      </label>
      <div class="settings-status" id="settingsStatusMsg"></div>
    </div>
    <button class="btn btn-ghost admin-refresh" id="refreshBtn">↻ רענון רשימה</button>
    <div id="listContainer"></div>
  </div>
</div>

<script src="https://accounts.google.com/gsi/client"></script>
<script>
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwRKdxmQxOImJJUAWey53QJwUGAUhFlHcZa8APXSfD1asOZ_-73Kat_auoOrtgOW0ZAbw/exec';
const GOOGLE_CLIENT_ID = '843570895037-4hduefa8p8aacp7iehsrq203iekd895t.apps.googleusercontent.com';
const IDTOKEN_KEY = 'anatoly_admin_idtoken_v1';

const lockScreen = document.getElementById('lockScreen');
const adminPanel = document.getElementById('adminPanel');
const lockError = document.getElementById('lockError');
const listContainer = document.getElementById('listContainer');
const refreshBtn = document.getElementById('refreshBtn');
const notifyEmailCheckbox = document.getElementById('notifyEmailCheckbox');
const notifyTelegramCheckbox = document.getElementById('notifyTelegramCheckbox');
const settingsStatusMsg = document.getElementById('settingsStatusMsg');

function getIdToken(){ return sessionStorage.getItem(IDTOKEN_KEY) || ''; }

async function tryUnlock(idToken){
  lockError.textContent = '';
  try{
    const res = await fetch(`${APPS_SCRIPT_URL}?action=list&idtoken=${encodeURIComponent(idToken)}`, {cache:'no-store'});
    const data = await res.json();
    if(data.error){
      lockError.textContent = 'החשבון הזה לא מורשה לנהל את האתר.';
      return;
    }
    sessionStorage.setItem(IDTOKEN_KEY, idToken);
    lockScreen.style.display = 'none';
    adminPanel.style.display = 'block';
    renderList(data);
    loadSettings();
  }catch(err){
    lockError.textContent = 'שגיאת חיבור, נסי שוב.';
  }
}

async function loadSettings(){
  const idToken = getIdToken();
  try{
    const res = await fetch(`${APPS_SCRIPT_URL}?action=getSettings&idtoken=${encodeURIComponent(idToken)}`, {cache:'no-store'});
    const data = await res.json();
    if(data.error) return;
    notifyEmailCheckbox.checked = !!data.email;
    notifyTelegramCheckbox.checked = !!data.telegram;
  }catch(err){}
}

async function saveSettings(){
  settingsStatusMsg.textContent = 'שומר...';
  const idToken = getIdToken();
  try{
    const res = await fetch(`${APPS_SCRIPT_URL}?action=setSettings&idtoken=${encodeURIComponent(idToken)}&email=${notifyEmailCheckbox.checked}&telegram=${notifyTelegramCheckbox.checked}`, {cache:'no-store'});
    const data = await res.json();
    if(data.error){
      settingsStatusMsg.textContent = 'שגיאה בשמירה.';
      return;
    }
    settingsStatusMsg.textContent = 'נשמר ✓';
    setTimeout(()=>{ settingsStatusMsg.textContent = ''; }, 1800);
  }catch(err){
    settingsStatusMsg.textContent = 'שגיאה בשמירה.';
  }
}

notifyEmailCheckbox.addEventListener('change', saveSettings);
notifyTelegramCheckbox.addEventListener('change', saveSettings);

function handleAdminGoogleSignIn(response){
  tryUnlock(response.credential);
}

if(window.google && google.accounts && google.accounts.id){
  google.accounts.id.initialize({
    client_id: GOOGLE_CLIENT_ID,
    callback: handleAdminGoogleSignIn
  });
  google.accounts.id.renderButton(
    document.getElementById('adminGoogleBtn'),
    { theme: 'outline', size: 'large', text: 'signin_with', shape: 'pill', locale: 'iw' }
  );
}

function renderList(rows){
  if(!rows.length){
    listContainer.innerHTML = '<div class="admin-empty">אין עדיין בקשות גישה 🙂</div>';
    return;
  }
  rows.sort((a,b)=> new Date(b.timestamp) - new Date(a.timestamp));
  listContainer.innerHTML = `
    <table class="admin-table">
      <thead><tr><th>שם</th><th>מייל</th><th>סטטוס</th><th>תאריך</th><th></th></tr></thead>
      <tbody>
        ${rows.map(r => `
          <tr data-row="${r.row}">
            <td>${r.name || '—'}</td>
            <td style="direction:ltr;text-align:right;">${r.email}</td>
            <td><span class="status-pill ${r.approved ? 'approved' : 'pending'}">${r.approved ? 'מאושר' : 'ממתין'}</span></td>
            <td>${new Date(r.timestamp).toLocaleDateString('he-IL')}</td>
            <td>
              ${r.approved
                ? `<button class="row-btn revoke" data-action="revoke" data-row="${r.row}">בטל גישה</button>`
                : `<button class="row-btn approve" data-action="approve" data-row="${r.row}">אשר גישה</button>`
              }
            </td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  `;
  listContainer.querySelectorAll('button[data-action]').forEach(btn=>{
    btn.addEventListener('click', ()=> toggleApproval(btn.dataset.row, btn.dataset.action === 'approve'));
  });
}

async function toggleApproval(row, approve){
  const idToken = getIdToken();
  await fetch(`${APPS_SCRIPT_URL}?action=setApproval&idtoken=${encodeURIComponent(idToken)}&row=${row}&value=${approve}`, {cache:'no-store'});
  loadList();
}

async function loadList(){
  listContainer.innerHTML = '<div class="admin-loading">טוען...</div>';
  const idToken = getIdToken();
  try{
    const res = await fetch(`${APPS_SCRIPT_URL}?action=list&idtoken=${encodeURIComponent(idToken)}`, {cache:'no-store'});
    const data = await res.json();
    if(data.error){
      lockScreen.style.display = 'block';
      adminPanel.style.display = 'none';
      sessionStorage.removeItem(IDTOKEN_KEY);
      return;
    }
    renderList(data);
  }catch(err){
    listContainer.innerHTML = '<div class="admin-empty">שגיאה בטעינה, נסי שוב.</div>';
  }
}

refreshBtn.addEventListener('click', loadList);

// auto-unlock if a still-valid token is cached for this browser tab session
const savedToken = getIdToken();
if(savedToken){
  lockScreen.style.display = 'none';
  adminPanel.style.display = 'block';
  loadList();
  loadSettings();
}
</script>
</body>
</html>
